name: Install SSH Key on VPS

on:
  workflow_dispatch:
    inputs:
      new_public_key:
        description: 'New SSH public key (from github_vps_new.pub)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-key:
    runs-on: ubuntu-latest
    steps:
      - name: Validate public key format
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.new_public_key }}" =~ ^ssh-(rsa|ed25519|ecdsa).* ]]; then
            echo "❌ Invalid SSH public key format"
            exit 1
          fi
          echo "✅ Public key format valid"

      - name: Install new public key on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🔐 Installing new SSH public key..."
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ inputs.new_public_key }}" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "✅ New public key installed successfully"

      - name: Success message
        run: |
          echo "🎉 SSH key successfully installed on VPS"
          echo ""
          echo "📋 Next steps:"
          echo "1. Test connection: ssh -i ~/github_vps_new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          echo "2. Update GitHub secret VPS_SSH_KEY with content of github_vps_new"
          echo "3. Test GitHub Actions deployment"
