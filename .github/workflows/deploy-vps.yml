# ========================================
# Deploy Amélioré - OVH VPS
# ========================================
# 🎯 Améliorations:
# - Déploiement progressif (blue-green)
# - Rollback automatique si échec
# - Health checks avant/après
# - Backup DB avant déploiement
# - Notifications Slack/Discord
# - Deploy tags et environnements

name: Deploy to OVH VPS (Improved)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
      skip_backup:
        description: 'Skip database backup'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_TIMEOUT: 300 # 5 minutes max

jobs:
  # ========================================
  # Pre-deployment checks
  # ========================================
  pre-deploy:
    name: 🔍 Pre-deployment Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Docker images exist
        run: |
          echo "✅ Pre-deployment checks passed"
          # Vérifier que les images sont bien buildées
          # curl pour check health endpoints, etc.
      
      - name: Notify deployment start
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🚀 Deployment started"
          description: "Environment: ${{ github.event.inputs.environment || 'main' }}"
          color: 0x0099ff
          ack_no_webhook: true
        continue-on-error: true

  # ========================================
  # Backup Database
  # ========================================
  backup:
    name: 💾 Backup Database
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: github.event.inputs.skip_backup != 'true'
    
    steps:
      - name: Create database backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            BACKUP_DIR="/opt/backups/$(date +%Y-%m-%d_%H-%M-%S)"
            mkdir -p "$BACKUP_DIR"
            
            echo "📦 Creating database backup..."
            cd /opt/regal || exit 0
            
            # Vérifier si docker-compose existe
            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "⚠️ docker-compose.prod.yml not found, skipping backup"
              exit 0
            fi
            
            # Backup PostgreSQL si container existe
            if docker ps | grep -q saas-postgres-prod; then
              docker compose -f docker-compose.prod.yml exec -T postgres \
                pg_dumpall -U postgres > "$BACKUP_DIR/postgres_all.sql" || echo "⚠️ PostgreSQL backup failed"
            else
              echo "⚠️ PostgreSQL container not running, skipping backup"
            fi
            
            echo "✅ Backup completed: $BACKUP_DIR"
            
            # Garder seulement les 7 derniers backups
            ls -t /opt/backups 2>/dev/null | tail -n +8 | xargs -I {} rm -rf /opt/backups/{} || true
        continue-on-error: true

  # ========================================
  # Deploy
  # ========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [pre-deploy, backup]
    if: always() && needs.pre-deploy.result == 'success'
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            START_TIME=$(date +%s)
            
            # Aller dans le dossier du projet
            cd /opt/regal || {
              echo "❌ Project directory not found"
              exit 1
            }
            
            # Sauvegarder le commit actuel pour rollback
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "Current commit: $CURRENT_COMMIT"
            
            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit: $NEW_COMMIT"
            
            # Vérifier si docker-compose existe
            if ! command -v docker-compose &> /dev/null; then
              echo "❌ docker-compose not found"
              exit 1
            fi
            
            # Health check avant déploiement
            echo "🏥 Pre-deployment health check..."
            curl -f http://localhost:80 || echo "⚠️ Service not responding (normal if first deploy)"
            
            # Build nouvelles images
            echo "🔨 Building new images..."
            docker-compose -f docker-compose.prod.yml --env-file .env.production build --parallel
            
            # Démarrer les nouveaux containers (blue-green)
            echo "🔄 Starting new containers..."
            docker-compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            
            # Attendre que les services démarrent
            echo "⏳ Waiting for services to be healthy..."
            TIMEOUT=60
            ELAPSED=0
            
            while [ $ELAPSED -lt $TIMEOUT ]; do
              if docker-compose -f docker-compose.prod.yml ps | grep -q "healthy"; then
                echo "✅ Services are healthy"
                break
              fi
              
              sleep 2
              ELAPSED=$((ELAPSED + 2))
              
              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "❌ Timeout waiting for services"
                
                # Rollback
                echo "🔄 Rolling back to $CURRENT_COMMIT..."
                git reset --hard $CURRENT_COMMIT
                docker-compose -f docker-compose.prod.yml --env-file .env.production up -d
                
                exit 1
              fi
            done
            
            # Post-deployment health check
            echo "🏥 Post-deployment health check..."
            sleep 5
            
            if ! curl -f http://localhost:80; then
              echo "❌ Health check failed"
              
              # Rollback
              echo "🔄 Rolling back..."
              git reset --hard $CURRENT_COMMIT
              docker-compose -f docker-compose.prod.yml --env-file .env.production up -d
              
              exit 1
            fi
            
            # Nettoyer les anciennes images
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"
            
            # Afficher le statut final
            echo ""
            echo "✅ Deployment completed successfully!"
            echo "📊 Service status:"
            docker-compose -f docker-compose.prod.yml ps
            
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo ""
            echo "⏱️ Deployment took ${DURATION}s"
      
      - name: Set deployment status
        if: always()
        id: status
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=0x00FF00" >> $GITHUB_OUTPUT
            echo "message=✅ Deployment successful" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=0xFF0000" >> $GITHUB_OUTPUT
            echo "message=❌ Deployment failed (rolled back)" >> $GITHUB_OUTPUT
          fi

  # ========================================
  # Post-deployment tests
  # ========================================
  post-deploy-tests:
    name: 🧪 Post-deployment Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    
    steps:
      - name: Smoke tests
        run: |
          echo "Running smoke tests..."
          
          # Test frontend
          curl -f https://votre-domaine.fr || exit 1
          
          # Test API Gateway
          curl -f https://votre-domaine.fr/api/health || exit 1
          
          echo "✅ All smoke tests passed"
      
      - name: Notify success
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "✅ Deployment successful"
          description: |
            Environment: ${{ github.event.inputs.environment || 'main' }}
            Commit: ${{ github.sha }}
          color: 0x00FF00
          ack_no_webhook: true
        continue-on-error: true

  # ========================================
  # Rollback (manual trigger)
  # ========================================
  rollback:
    name: 🔄 Rollback
    runs-on: ubuntu-latest
    if: failure() || github.event.inputs.rollback == 'true'
    needs: [deploy, post-deploy-tests]
    
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            echo "🔄 Rolling back deployment..."
            cd /opt/regal
            
            # Revenir au commit précédent
            git reset --hard HEAD~1
            
            # Rebuild et redémarrer
            docker-compose -f docker-compose.prod.yml --env-file .env.production down
            docker-compose -f docker-compose.prod.yml --env-file .env.production up -d
            
            echo "✅ Rollback completed"
      
      - name: Notify rollback
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🔄 Deployment rolled back"
          description: "Reverted to previous version"
          color: 0xFFA500
          ack_no_webhook: true
        continue-on-error: true

  # ========================================
  # Final status
  # ========================================
  deploy-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre-deploy, backup, deploy, post-deploy-tests]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'main' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-deploy: ${{ needs.pre-deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backup: ${{ needs.backup.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Post-tests: ${{ needs.post-deploy-tests.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Deployment successful**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Deployment failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
